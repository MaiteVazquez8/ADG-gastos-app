name: Build Android APK

# Builds the APK when a GitHub Release is published, or manually via
# "Run workflow". The APK is uploaded as a workflow artifact and attached to
# the Release if the run was triggered by one.
#
# Requires an Expo access token stored as a GitHub secret named EXPO_TOKEN.
# Create one at https://expo.dev/accounts/<tu-cuenta>/settings/access-tokens
# and add it under Settings > Secrets and variables > Actions.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Build Android APK (EAS)
        id: eas
        run: |
          # Build the APK and capture the build id so we can download the artifact.
          eas build \
            --platform android \
            --profile preview \
            --non-interactive \
            --json > eas-build.json
          cat eas-build.json

      - name: Download APK
        run: |
          mkdir -p apk-download
          node -e "
            const data = require('./eas-build.json');
            const build = Array.isArray(data) ? data[0] : data;
            if (!build?.id) { console.error('No EAS build id found'); process.exit(1); }
            require('fs').writeFileSync('eas-build-id.txt', build.id);
          "
          eas artifact:download --platform android --id "$(cat eas-build-id.txt)" --output-dir ./apk-download
          ls -la apk-download

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-android-apk
          path: apk-download/*.apk
          if-no-files-found: error

      - name: Attach APK to Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(ls apk-download/*.apk | head -n1)
          gh release upload "${{ github.event.release.tag_name }}" "$APK" --clobber
